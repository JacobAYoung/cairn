[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cairn"
description = "Portable, toggleable, cross-machine vault for your Claude Code setup."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jake Young" }]
dynamic = ["version"]
dependencies = [
    "httpx>=0.28", # local-model delegation (Ollama) + any HTTP the sync/status checks need
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
cairn = "cairn.cli:main"

[tool.hatch.version]
path = "src/cairn/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = import sorting, UP = pyupgrade, B = bugbear
select = ["E", "F", "I", "UP", "B"]
