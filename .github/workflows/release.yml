name: Release

# Build and publish a GitHub Release (with wheel + sdist attached) whenever a version tag is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag matches the package version
        run: |
          PKG_VERSION="$(sed -nE 's/^__version__ *= *"([^"]+)".*/\1/p' src/cairn/__init__.py)"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package=$PKG_VERSION tag=$TAG"
          test "$PKG_VERSION" = "$TAG" || { echo "::error::tag $TAG != __version__ $PKG_VERSION"; exit 1; }

      - name: Run tests
        run: |
          python -m pip install -e ".[dev]"
          ruff check .
          pytest

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "Cairn ${GITHUB_REF_NAME}"
